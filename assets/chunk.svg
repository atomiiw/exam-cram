<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The sign in front of beta z gives the direction</title>
  <rect width="680" height="300" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <line x1="200" y1="26" x2="290" y2="26" stroke="#D85A30" stroke-width="2" marker-end="url(#a)"/>
  <path d="M80 47 C109 47,131 117,160 117 C189 117,211 47,240 47 C269 47,291 117,320 117 C349 117,371 47,400 47" fill="none" stroke="#7F77DD" stroke-width="2.5" stroke-linecap="round"/>
  <path transform="translate(30,0)" d="M80 47 C109 47,131 117,160 117 C189 117,211 47,240 47 C269 47,291 117,320 117 C349 117,371 47,400 47" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.6"/>
  <text x="460" y="74" font-size="15" font-weight="600" fill="#1f2328">cos(ωt − βz)</text>
  <text x="460" y="96" font-size="13" fill="#59636e">minus sign: moves toward +z</text>
  <line x1="290" y1="162" x2="200" y2="162" stroke="#D85A30" stroke-width="2" marker-end="url(#a)"/>
  <path d="M80 183 C109 183,131 253,160 253 C189 253,211 183,240 183 C269 183,291 253,320 253 C349 253,371 183,400 183" fill="none" stroke="#1D9E75" stroke-width="2.5" stroke-linecap="round"/>
  <path transform="translate(-30,0)" d="M80 183 C109 183,131 253,160 253 C189 253,211 183,240 183 C269 183,291 253,320 253 C349 253,371 183,400 183" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.6"/>
  <text x="460" y="210" font-size="15" font-weight="600" fill="#1f2328">cos(ωt + βz)</text>
  <text x="460" y="232" font-size="13" fill="#59636e">plus sign: moves toward −z</text>
  <text x="240" y="285" font-size="13" fill="#59636e" text-anchor="middle">solid = now, dashed = a moment later</text>
</svg>
